name: "Feature Request"
description: Suggest an idea, feature, or enhancement
title: "feat: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Thank you for taking the time to suggest an idea or enhancement!

  - type: textarea
    attributes:
      label: Problem statement
      description: What is the problem this feature would solve?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Proposed solution
      description: What change or behavior would you like to see?
    validations:
      required: true

  - type: textarea
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you considered.

  - type: checkboxes
    attributes:
      label: Contributing to this feature (thanks!)
      description: If you plan to contribute a pull request for this feature, please check the box below. This lets us and others know that someone is interested in working on it.
      options:
        - label: I would be willing to submit a pull request for this feature.

  - type: checkboxes
    attributes:
      label: Self-check
      description: Before submitting the issue, please make sure you do the following.
      options:
        - label: Follow our [Code of Conduct](https://github.com/jrwnnnn/scaffold-astro/blob/main/CODE_OF_CONDUCT.md)
          required: true
        - label: Read the [Contributing Guidelines](https://github.com/jrwnnnn/scaffold-astro/blob/main/CONTRIBUTING.md).
          required: true
        - label: Check that there isn't [already an issue](https://github.com/jrwnnnn/scaffold-astro/issues) that is requesting the same feature to avoid creating a duplicate.
          required: true
